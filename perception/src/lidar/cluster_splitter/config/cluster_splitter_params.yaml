cluster_splitter:
  ros__parameters:
    input_topic: "/pointcloud/clustered"
    output_topic: "/pointcloud/clustered_split"

    min_points_to_consider_split: 18
    oversized_point_count: 30
    oversized_axis_length_m: 0.65

    valley_min_gap_m: 0.15
    min_subcluster_points: 6
    max_recursive_depth: 5

    enable_kmeans_fallback: true
    kmeans_max_iterations: 20
    kmeans_min_centroid_distance_m: 0.507

    # 클러스터 중심 간 거리가 near_radius_m 이하면 인접 클러스터끼리 다른 색으로 컬러링
    enable_near_radius_coloring: false
    near_radius_m: 2.0

    preserve_noise_points: true

    # 콘 검증 필터링
    enable_cone_validation: true
    cone_diameter_m: 0.607       # 바닥 지름 (병합 기준)
    cone_max_width_m: 0.75       # XY 범위 허용 최대 (지름 + 여유)
    cone_min_width_m: 0.10       # XY 범위 허용 최소 (너무 작으면 노이즈)
    cone_max_height_m: 1.3       # Z 범위 허용 최대 (높이 + 여유)
    cone_min_height_m: 0.15      # Z 범위 허용 최소 (너무 낮으면 노이즈)
    cone_min_points: 5           # 최소 포인트 수

# gazebo 라바콘 크기 :
#   - 가로(X): 약 0.503 m
#   - 세로(Y): 약 0.503 m
#   - 바닥 지름 : 약 0.607 m
#   - 높이(Z): 약 1.089 m
