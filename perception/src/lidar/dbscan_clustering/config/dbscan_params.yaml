dbscan_clustering:
  ros__parameters:
    input_topic: "/patchworkpp/nonground"
    output_topic: "/pointcloud/clustered"
    eps: 0.24
    min_points: 15
    max_neighbors: 1024
    max_points: 500000
    queue_size: 1

    # ROI
    roi_min_x: -15.0
    roi_max_x: 15.0
    roi_min_y: -15.0
    roi_max_y: 15.0
    roi_min_z: -2.0
    roi_max_z: 0.0

    enable_ring_ground_removal: false
    ground_min_range: 2.0
    ground_z_threshold: 0.20
    ground_azimuth_bins: 360

    enable_azimuth_ground_suppression: true
    azimuth_ground_min_range: 2.0
    azimuth_ground_z_threshold: 0.1
    azimuth_ground_bins: 720

    cluster_xy_only: false
    # z축 거리 적응형 가중치 (cluster_xy_only: false 일 때만 동작)
    # z_scaled = z * z_weight / (1 + range_xy * z_distance_scale)
    z_weight: 0.3
    z_distance_scale: 0.05

    # 클러스터 중심 간 거리가 near_radius_m 이하면 인접 클러스터끼리 다른 색으로 컬러링
    enable_near_radius_coloring: true
    near_radius_m: 2.0
