# dbscan_clustering parameters
# - input_topic: topic to subscribe input PointCloud2 (ground removed)
# - output_topic: topic to publish clustered PointCloud2
# - eps: DBSCAN radius (meters)
# - min_points: minimum neighbors to be a core point
# - max_neighbors: per-point neighbor cap returned from GPU
# - max_points: truncate input points above this
# - queue_size: subscription queue size
dbscan_clustering:
  ros__parameters:
    input_topic: "/patchworkpp/nonground"
    output_topic: "/pointcloud/clustered"
    eps: 0.70
    min_points: 6
    max_neighbors: 1024
    max_points: 500000
    queue_size: 1

    # ROI: 전방 20m, 좌우 5m, 높이 -2~2m
    roi_min_x: 0.5
    roi_max_x: 20.0
    roi_min_y: -50.0
    roi_max_y: 50.0
    roi_min_z: -2.0
    roi_max_z: 2.0

    # Patchwork++ 파이프라인 사용 시 false 유지
    enable_ring_ground_removal: false
    ground_min_range: 2.0
    ground_z_threshold: 0.20
    ground_azimuth_bins: 360

    # nonground 잔여 바닥/선형 잡음 억제 (방위각 bin별 최소 z 기준)
    enable_azimuth_ground_suppression: true
    azimuth_ground_min_range: 2.0
    azimuth_ground_z_threshold: 0.12
    azimuth_ground_bins: 720

    # 원기둥 등 수직 객체가 레이어별로 분리되지 않도록 XY 기준 클러스터링
    cluster_xy_only: true
