make_bbox:
  ros__parameters:
    input_topic: "/pointcloud/clustered"
    output_topic: "/perception/raw_bboxes"
    marker_topic: "/perception/bboxes_marker"
    
    # 클러스터 분할 (붙어있는 콘 분리용)
    # XY 최장축이 cone_diameter보다 크면 k=round(최장축/cone_diameter)로 K-means 분할
    enable_cluster_split: true
    split_cone_diameter_m: 0.5    # 콘 지름 기준 (m)
    split_kmeans_max_iter: 15     # K-means 최대 반복
    split_min_points: 0           # 분할 후 최소 포인트 수 (미달 시 버림)

    # bbox 크기 상한 필터 (대회 라바콘 규격 + 0.05m 패딩)
    #   라바콘: X=0.500, Y=0.500, Z=0.840

    # 대회 라바콘 규격 :
    #   - 가로(X): 약 0.500 m
    #   - 세로(Y): 약 0.500 mz
    #   - 높이(Z): 약 0.840 m
    max_size_x: 0.4
    max_size_y: 0.4
    max_size_z: 0.60

    # bbox 크기 하한 필터 (납작한 바닥 노이즈 클러스터 제거)
    # 클러스터에 속한 포인트들의 z_max - z_min (= 높이 extent)이 0.12m 이하면 납작한 바닥 노이즈로 판단하고 bbox를 생성하지 않습니다.
    # rosbag 분석 결과: z < 0.10m 구간에 8.9% 노이즈 집중, 0.10~0.15m 갭 존재
    min_size_z: 0.12

