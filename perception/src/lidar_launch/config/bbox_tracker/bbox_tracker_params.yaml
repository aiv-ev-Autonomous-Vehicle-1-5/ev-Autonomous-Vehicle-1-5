bbox_tracker_node:
  ros__parameters:
    wheelbase: 0.87             # [m] T870 축간거리
    min_match_dist: 0.1         # [m] 동적 매칭 최소 거리 (저속/정지 시 하한)
    max_miss_count: 20          # 연속 미검출 허용 횟수 (10Hz 기준 2초)
    input_topic: "/perception/raw_bboxes"
    output_topic: "/perception/bboxes"
    control_topic: "/t870/control_command"
