dbscan_clustering:
  ros__parameters:
    input_topic: "/patchworkpp/nonground"
    output_topic: "/pointcloud/clustered"
    eps: 0.15
    min_points: 10
    max_neighbors: 1024
    max_points: 80000
    queue_size: 1

    # ROI
    roi_min_x: -4.0
    roi_max_x: 12.0
    roi_min_y: -8.0
    roi_max_y: 8.0
    roi_min_z: -3.0
    roi_max_z: 1.0

    enable_azimuth_ground_suppression: true
    azimuth_ground_min_range: 2.0
    azimuth_ground_z_threshold: 0.001
    azimuth_ground_bins: 720

    cluster_xy_only: false
    
    # z축 거리 적응형 가중치 (cluster_xy_only: false 일 때만 동작)
    # z_scaled = z * z_weight / (1 + range_xy * z_distance_scale)
    # 현재 라바콘이 제대로 하나의 클러스터로 묶이고 있다면 유지해도 됨
    # 만약 먼 라바콘이 위/아래로 쪼개지는 현상이 보인다면 z_weight를 0.2로 낮추면 꼭대기 z_scaled가 eps 근처(~0.13)로 내려와 개선됨
    z_weight: 0.3
    z_distance_scale: 0.05

    # gazebo 라바콘 크기 :
    #   - 가로(X): 약 0.503 m
    #   - 세로(Y): 약 0.503 m
    #   - 바닥 지름 : 약 0.607 m
    #   - 높이(Z): 약 1.089 m
    
    # 대회 라바콘 규격 : 
    #   - 가로(X): 약 0.500 m
    #   - 세로(Y): 약 0.500 m
    #   - 높이(Z): 약 0.840 m