patchworkpp_node:
  ros__parameters:
    # base frame id
    frame_id: "velodyne"

    # 센서 지면 높이 (미터) - 실제 LiDAR 장착 높이에 맞춰 조정
    sensor_height: 0.7

    # PCA 기반 지면 추정 반복 횟수
    num_iter: 3

    # 초기 시드 선택 시 최저점 후보 최대 개수
    num_lpr: 20

    # 각 패치에서 지면으로 추정하기 위한 최소 포인트 수
    num_min_pts: 10

    # 초기 시드 선택 시 최저점 임계값
    th_seeds: 0.3

    # 지면 두께 임계값 (0.06은 너무 엄격 → 기본값 0.125 사용)
    th_dist: 0.125

    # 수직 구조물 초기 시드 선택 임계값
    th_seeds_v: 0.25

    # 수직 구조물 두께 임계값
    th_dist_v: 0.1

    # 지면 추정 최대 범위 (미터)
    max_range: 80.0

    # 지면 추정 최소 범위 (미터) - 0.1은 너무 작아 CZM 구조 왜곡
    min_range: 1.0

    # GLE 수직성 임계값 - cos(45°)=0.707이 기본값
    # 0.101은 cos(84°)으로 거의 수직인 면도 지면 후보로 판단됨
    uprightness_thr: 0.707

    # 상세 로그 출력 (false로 변경 시 성능 향상)
    verbose: false
