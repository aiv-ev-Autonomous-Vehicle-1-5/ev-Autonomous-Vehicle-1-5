# Enable mouse support for pane selection, resizing, and scrolling.
set -g mouse on

# Replace tmux's default prefix (C-b) with F2.
# Example: F2 c creates a new window, F2 d detaches the session.
unbind C-b
set -g prefix F2
bind F2 send-prefix

# Window shortcuts under the normal tmux prefix (F2).
# F2 l: list windows
# F2 f: find window by name/content
# F2 n: rename current window
# F2 w: kill current window with confirmation
# F2 Left/Right: previous/next window
# F2 Up: jump back to the last window
bind -T prefix l choose-window
bind -T prefix f command-prompt "find-window '%%'"
bind -T prefix n command-prompt -I "#W" "rename-window -- '%%'"
bind -T prefix w confirm-before -p "kill-window #W? (y/n)" kill-window
bind -T prefix Right next-window
bind -T prefix Left previous-window
bind -T prefix Up last-window

# F3 enters a custom pane-control table.
# Use F3 followed by one of the keys below for pane actions.
bind -n F3 if-shell -F '#{==:#{client_key_table},root}' 'switch-client -T paneprefix' 'send-keys F3'

# F3 e/o: split the current window into left-right / top-bottom panes.
bind -T paneprefix e split-window -h
bind -T paneprefix o split-window -v

# F3 + arrow keys: move focus between panes.
bind -T paneprefix Left select-pane -L
bind -T paneprefix Down select-pane -D
bind -T paneprefix Up select-pane -U
bind -T paneprefix Right select-pane -R

# F3 z: zoom/unzoom the active pane.
bind -T paneprefix z resize-pane -Z

# F3 w: kill the active pane.
bind -T paneprefix w kill-pane

# F3 Esc: leave pane-control mode without taking an action.
bind -T paneprefix Escape switch-client -T root

# F3 1/2/3: rebalance panes using common layouts.
bind -T paneprefix 1 select-layout tiled
bind -T paneprefix 2 select-layout even-horizontal
bind -T paneprefix 3 select-layout even-vertical
