mr_planner_node:
  ros__parameters:

    # ============================================================
    # Costmap — Magnetic Resistance costmap
    # ============================================================
    costmap:
      size_x: 10.0           # [m] grid 전체 폭 (ego 중심: -5 ~ +5)
      size_y: 10.0           # [m] grid 전체 높이
      resolution: 0.05       # [m/cell] 셀 크기 (200x200 = 40,000 cells)
      cone_cost_max: 100.0   # 콘 중심 최대 cost (S극 자력)
      lane_cost_max: 50.0    # 차선 경계점 최대 cost
      cone_radius: 0.65      # [m] 콘 클러스터 반지름 (이 내부는 cost=max)
      alpha: 2.0             # 감쇠율: cost = max / (1 + α·d_eff²)
      cost_threshold: 2.0    # cutoff: 이 값 미만이면 0 처리

    # ============================================================
    # Planner — Greedy 전진 탐색
    # ============================================================
    planner:
      search_radius: 0.30    # [m] 전방 180° 탐색 반경
      max_steps: 200         # 최대 경로 포인트 수
      heading_init_x: 1.0    # 초기 heading X (+x = 전방)
      heading_init_y: 0.0    # 초기 heading Y

    # ============================================================
    # Vehicle (T870, track_planning과 동일)
    # ============================================================
    vehicle:
      width: 0.50            # [m] 차폭
      wheelbase: 0.87        # [m] 축간 거리
      delta_max: 0.314       # [rad] 최대 조향각 (~18°)

    # ============================================================
    # Safety
    # ============================================================
    safety:
      margin: 0.10           # [m] 안전 마진

    # ============================================================
    # Speed
    # ============================================================
    speed:
      v_max: 1.60            # [m/s] 최대 속도
      a_lat_max: 2.0         # [m/s²] 최대 횡가속도

    # ============================================================
    # Postprocess (track_planning과 동일)
    # ============================================================
    postprocess:
      resample_ds: 0.10      # [m] 출력 경로 포인트 간격
      smooth_window: 5       # 이동 평균 윈도우 크기
      prune_max_dev: 0.15    # [m] 가지치기 최대 횡편차

    # ============================================================
    # Timeouts
    # ============================================================
    timeouts:
      perception_ms: 300     # [ms] 인식 데이터 타임아웃
