costmap_builder:
  ros__parameters:
    # Topics
    input_topic: "/pointcloud/clustered_split"
    output_topic: "/planning/costmap"

    # Frame
    frame_id: "base_link"

    # Grid geometry (OV-05)
    origin_x: -1.0          # Grid origin X in base_link (m)
    origin_y: -4.0          # Grid origin Y in base_link (m)
    grid_width: 11.0        # X extent: -1 to +10 (m)
    grid_height: 8.0        # Y extent: -4 to +4 (m)
    resolution: 0.10        # Meters per cell -> 110x80 = 8800 cells

    # Obstacle rasterization
    obstacle_radius: 0.30   # Cone base radius (~0.607m diameter / 2)
    occupied_value: 100      # OccupancyGrid value for obstacle cells
    min_cluster_points: 3    # Min points per cluster to consider valid

    # Inflation
    inflation_radius: 0.45  # Vehicle half-width(0.35) + margin(0.10)
    inflation_cost_max: 99   # Cost at obstacle boundary
    inflation_cost_min: 1    # Cost at inflation outer edge (linear decay)

    # Staleness
    stale_threshold_sec: 0.5 # Max acceptable input data age (s)
