# ============================================================================
# planning_mr.yaml — MR Planner 파라미터 설정 파일
#
# 이 파일의 값은 노드 시작 시 params.hpp의 PlanningParams 구조체로 로드된다.
# 여기서 값을 변경하면 노드 재시작 후 반영된다.
#
# 네이밍 규칙: 'mr_planner_node' → launch 파일의 name과 일치해야 함
# ============================================================================
mr_planner_node:
  ros__parameters:

    # ============================================================
    # Costmap — Magnetic Resistance costmap
    #
    # 콘과 차선을 S극 자석으로 모델링하여 2D 그리드에 자력(cost)을 기록한다.
    # ego(0,0)을 중심으로 size_x × size_y 크기의 그리드를 생성한다.
    #
    # Gaussian 감쇠: cost = cost_max · exp(-d_eff² / (2σ²))
    #   d_eff = max(0, 거리 - inner_radius)
    #   유효 반경 ≈ 3σ (99.7% 감쇠), σ=1.0 → 3m 밖은 거의 0
    # ============================================================
    costmap:
      size_x: 16.0           # [m] grid 전체 폭 (ego 중심: -8 ~ +8)
      size_y: 16.0           # [m] grid 전체 높이 (ego 중심: -8 ~ +8)
      resolution: 0.05       # [m/cell] 셀 크기 → 320×320 cells
      cone_cost_max: 100.0   # 콘 중심 최대 cost (S극 자력, 가장 강함)
      lane_cost_max: 50.0    # 차선 경계점 최대 cost (콘의 절반)
      cone_radius: 0.65      # [m] 콘 flat zone 반지름 (PE 드럼 반지름, 이 내부=최대 cost)
      sigma: 1.0             # [m] Gaussian σ (영향 범위 ≈ 3σ = 3m)
                              #     σ↑: 넓고 완만, σ↓: 좁고 급격
      cost_threshold: 2.0    # cutoff: 이 값 미만이면 0 처리 (연산 절약)

    # ============================================================
    # Planner — Greedy 전진 탐색
    #
    # ego(0,0)에서 heading 방향으로 전방 180°를 탐색하며
    # cost가 가장 낮은 셀로 한 칸씩 이동하여 경로를 생성한다.
    # ============================================================
    planner:
      search_radius: 0.30    # [m] 한 스텝당 탐색 반경 (이 원 안에서 최소 cost 셀 선택)
      max_steps: 200         # 최대 경로 포인트 수 (= 최대 이동 횟수)
      heading_init_x: 1.0    # 초기 heading X (+x = 전방, 차량 진행 방향)
      heading_init_y: 0.0    # 초기 heading Y (0 = 직진)

      # ── APF 역주행 방지 (Local Minima 대응) ──
      forward_cone_deg: 60.0        # [deg] 전방 탐색 콘 각도 (±60°, 기존 180°에서 축소)
                                     # cos(60°)=0.5 → alignment > 0.5 인 셀만 후보
      max_steer_per_step_deg: 10.0   # [deg] 1스텝당 최대 heading 변화각 (hard clamp)
      heading_damping: 0.5           # 이전 heading 유지 비율 (0.5 = old 50% + move 50%)

    # ============================================================
    # Vehicle (T870 전동 카트, track_planning과 동일)
    # ============================================================
    vehicle:
      width: 0.50            # [m] 차폭
      wheelbase: 0.87        # [m] 축간 거리 (앞바퀴~뒷바퀴 중심)
      delta_max: 0.314       # [rad] 최대 조향각 (~18°) → r_min ≈ 2.67m

    # ============================================================
    # Safety — 안전 마진
    # ============================================================
    safety:
      margin: 0.10           # [m] 장애물과의 안전 마진

    # ============================================================
    # Speed — 속도 제한
    #
    # 곡선 구간 속도 제한: v = sqrt(a_lat_max / curvature)
    # 직선 구간: v_max 사용
    # ============================================================
    speed:
      v_max: 1.60            # [m/s] 최대 속도
      a_lat_max: 2.0         # [m/s²] 최대 횡가속도 (원심력 기준)

    # ============================================================
    # Postprocess — 경로 후처리 (track_planning과 동일)
    #
    # raw_path → prune → smooth → resample → yaw
    # ============================================================
    postprocess:
      resample_ds: 0.10      # [m] 출력 경로 포인트 간격
      smooth_window: 5       # 이동 평균 윈도우 크기 (좌2 + 자신 + 우2)
      prune_max_dev: 0.15    # [m] 가지치기 최대 횡편차

    # ============================================================
    # SensorTf — velodyne → base_link 좌표 오프셋
    #
    # t870.xacro 기준: velodyne는 base_link로부터 (0.7, 0, 0.7)에 마운트
    # parse_cones()에서 콘 좌표를 base_link 기준으로 보정할 때 사용
    # ============================================================
    sensor_tf:
      tf_x: 0.0             # [m] 전방 오프셋 (velodyne이 base_link보다 앞에 있음)
      tf_y: 0.0             # [m] 좌우 오프셋
      tf_z: 0.7             # [m] 높이 오프셋

    # ============================================================
    # Timeouts — 인식 데이터 타임아웃
    # ============================================================
    timeouts:
      perception_ms: 300     # [ms] 이 시간 내 미수신 시 STALE 판정
