# ============================================================================
# planning_lc.yaml — LC Planner 파라미터 설정 파일
#
# 파이프라인 순서대로 배치:
#   Stage 0: SensorTf + Timeouts (입력 전처리)
#   Stage 1: (Input Parse — 파라미터 없음)
#   Stage 2: Chainer (좌/우 체이닝)
#   Stage 3: Costmap + A* (비용지도 생성 + 경로 탐색)
#   Stage 5: Postprocess (prune → smooth → curvature_clamp → resample)
#   Stage 6: Safety Check (vehicle 파라미터 사용)
# ============================================================================
lc_planner_node:
  ros__parameters:

    # ============================================================
    # [Stage 0] Timeouts — 인지 데이터 신선도 검사
    # ============================================================
    timeouts:
      perception_ms: 300

    # ============================================================
    # [Stage 2] Chainer — DirectionChainer v2 파라미터
    #
    # Component → Backbone 기반 좌/우 차선 경계 체이닝.
    # ============================================================
    chainer:
      # --- Seed 선택 ---
      side_seed_y: 0.15        # [m] |y| < 이 값이면 seed 후보 제외
      seed_max_dist: 4.0 # [m] seed 탐색 최대 거리 (Pass 1/2 공통)
      seed_rear_limit: 1.0   # [m] x < -이 값이면 seed 후보 제외 (후방 제한)

      # --- kNN + 게이트 ---
      k: 30                    # centroid kNN 후보 수
      d_max_bbox: 2.25    # [m] 현재 노드가 BBOX일 때 탐색 최대 거리
      d_max_lane: 2.25     # [m] 현재 노드가 LANE일 때 탐색 최대 거리
      forward_cone_deg: 120.0 # [deg] 전방 cone 전체 각도 (±60°)
      lateral_gate: 1.3      # [m] 횡방향 오차 한계

      # --- 비용함수 가중치 ---
      alpha: 1.2              # 거리 비용
      beta: 1.2               # 방향 오차 비용
      gamma: 0.7              # 횡오차 비용
      delta: 0.2              # 크기 변화 비용 (bbox 전용)

      # --- Backbone (greedy chaining) ---
      lambda_side: 0.5        # side preference 가중치

      # --- Backtracking (독립 체이닝 중복 해소) ---
      max_backtrack_count: 5  # 중복 해소 최대 반복 횟수 (0=비활성화)
      backtrack_w_curv: 1.0   # 곡률 변화량 가중치
      backtrack_w_dist: 1.0   # 노드 거리 가중치

      # --- 종료/제한 ---
      max_chain_len: 100      # backbone 최대 길이

      # --- 리샘플링 ---
      resample_ds: 0.1        # [m] component 전체 리샘플 간격

      # --- 디버그 ---
      publish_debug: true     # rviz2 시각화용 디버깅 토픽 발행 

    # ============================================================
    # [Stage 3] Costmap — 가우시안 비용 지도 생성
    # ============================================================
    costmap:
      size_x: 16.0              # [m] costmap X 전체 크기
      size_y: 16.0              # [m] costmap Y 전체 크기
      resolution: 0.15          # [m/cell] (1.5m 차로 = 10셀)
      bbox_cost_max: 100.0      # bbox 최대 비용(==costmap max cost)
      lane_cost_max: 80.0       # 차선 최대 비용 (낮아서 넘을 수 있음)
      bbox_radius: 0.55         # bbox flat zone 반경: 0.65 + (width/2) = 0.65 + 0.375 ≈ 1.025
      unchained_bbox_radius: 0.55  # unchained bbox 전용 flat zone 반경 [m] (backbone 미체이닝 장애물)
      lane_radius: 0.3           # lane flat zone 반경 [m] (0.0 = flat zone 없음)
      sigma: 1.0                # [m] 가우시안 확산
      cost_threshold: 15.0       # 이 이하 비용 무시
      entry_wall_ego_y: 2.5     # [m] costmap 하단 양옆 가상 bbox 시작점 횡방향 오프셋
      origin_x: -4.0            # [m] costmap X 원점 (base_link 기준). -4 = 후방 4m 포함
      center_attract_max: 90.0  # 중앙선 최대 비용 감소량
      center_attract_sigma: 0.07 # [m] 중앙선 유인 가우시안 확산
      track_half_width: 1.3     # [m] 트랙 반폭 — 한쪽 chain만으로 centerline 계산 시 수직 오프셋
      center_gap_threshold: 3.3  # [m] 양쪽 chain 간 거리가 이 값 초과 시 centerline midpoint 생성 안 함 (노이즈 제거)

    # ============================================================
    # [Stage 3] A* — 격자 경로 탐색
    # ============================================================
    astar:
      max_iterations: 5000
      goal_tolerance: 0.3       # [m]
      cost_weight: 20.0         # costmap 비용 가중치
      obstacle_cost: 100.0       # 통과 불가 비용 임계값
      goal_max_cost: 99.0        # local goal 허용 최대 비용 (이 미만인 픽셀만 goal 후보)

    # ============================================================
    # [Stage 5] Postprocess — prune → smooth → curvature_clamp → resample → yaw
    # ============================================================
    postprocess:
      resample_ds: 0.10              # [m] 등간격 리샘플링 간격 (제어기가 등간격 waypoint를 기대)
      smooth_window: 5               # 이동 평균 윈도우 크기 (앞뒤 2개씩 총 5개 평균)
      prune_max_dev: 0.15            # [m] prune 허용 최대 수직 편차 (이내면 직선으로 간주, 중간점 제거)
      curvature_clamp_max_iter: 300  # 곡률 제한 최대 반복 횟수 (kappa > kappa_max인 점을 중점 방향으로 이동)

    # ============================================================
    # [Stage 6] Safety — 안전 검사 파라미터
    # ============================================================
    safety:
      min_path_length: 1.5            # [m] 최소 경로 길이 (이하이면 "WARNING - too short valid path")

    # ============================================================
    # [Stage 5-6] Vehicle (T870) — 차량 제원 (postprocess + safety에서 사용)
    # ============================================================
    vehicle:
      width: 0.79
      wheelbase: 0.733
      delta_max: 0.3249  # tan(18°) = 0.32491
