yolo_lane_cluster_node:
  ros__parameters:
    # ── 시드 설정 (고정 위치) ──
    seed:
      left_y: 1.1              # 왼쪽 시드 y [m] (ego 좌측)
      right_y: -1.1            # 오른쪽 시드 y [m] (ego 우측)
      timeout_sec: 3.0         # [s] chaining 미성공 시 seed 초기 위치로 리셋하는 타임아웃

    # ── Backbone Chainer ──
    chainer:
      d_max: 3.0               # [m] 탐색 최대 거리
      forward_cone_deg: 120.0  # [deg] 전방 cone 전체 각도 (±60°)
      lateral_gate: 1.3        # [m] 횡방향 오차 한계
      alpha: 2.0               # 거리 비용 가중치 (C_d)
      beta: 1.2                # 방향 오차 비용 가중치 (C_a)
      gamma: 0.7               # 횡오차 비용 가중치 (C_lat)
      lambda_side: 0.5         # side preference 가중치 (C_side)
      max_backtrack_count: 5   # 중복 해소 최대 반복 횟수
      backtrack_w_curv: 1.0    # backtracking 곡률 가중치
      backtrack_w_dist: 1.0    # backtracking 거리 가중치
      max_chain_len: 300       # backbone 최대 길이

    # ── Holdover — chaining 실패 시 이전 결과 재발행 ──
    holdover:
      frames: 3                # 최대 holdover 프레임 수 (1-2프레임 누락 방어)

    # ── 가상 차선 ──
    virtual_lane:
      track_width: 1.6          # 트랙 폭 [m] — 가상 차선 오프셋 거리
