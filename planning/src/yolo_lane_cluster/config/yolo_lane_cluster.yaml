yolo_lane_cluster_node:
  ros__parameters:
    # ── 시드 설정 ──
    seed:
      init_x: 0.0               # 시드 초기 x 위치 [m]
      left_y: 0.8              # 왼쪽 시드 y 오프셋 [m] (ego 좌측)
      right_y: -0.8            # 오른쪽 시드 y 오프셋 [m] (ego 우측)
      search_rect_width: 1.0    # 탐색 직사각형 y 방향 폭 [m]
      search_rect_height: 3.0   # 탐색 직사각형 x 방향 높이 [m]

    # ── 가상 차선 ──
    virtual_lane:
      track_width: 1.6          # 트랙 폭 [m] — 가상 차선 오프셋 거리
