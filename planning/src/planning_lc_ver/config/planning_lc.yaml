# ============================================================================
# planning_lc.yaml — LC Planner 파라미터 설정 파일
#
# planning_mr_ver 기반 + chainer 섹션 추가
# ============================================================================
lc_planner_node:
  ros__parameters:

    # ============================================================
    # Costmap — Magnetic Resistance costmap
    # ============================================================
    costmap:
      size_x: 16.0
      size_y: 16.0
      resolution: 0.05
      cone_cost_max: 100.0
      lane_cost_max: 50.0
      cone_radius: 0.65
      sigma: 1.0
      cost_threshold: 2.0

    # ============================================================
    # Planner — Greedy 전진 탐색
    # ============================================================
    planner:
      search_radius: 0.30
      max_steps: 200
      heading_init_x: 1.0
      heading_init_y: 0.0
      forward_cone_deg: 90.0
      max_steer_per_step_deg: 10.0
      heading_damping: 0.5

    # ============================================================
    # Vehicle (T870)
    # ============================================================
    vehicle:
      width: 0.50
      wheelbase: 0.87
      delta_max: 0.314

    # ============================================================
    # Safety
    # ============================================================
    safety:
      margin: 0.10

    # ============================================================
    # Speed
    # ============================================================
    speed:
      v_max: 1.60
      a_lat_max: 2.0

    # ============================================================
    # Postprocess
    # ============================================================
    postprocess:
      resample_ds: 0.10
      smooth_window: 5
      prune_max_dev: 0.15

    # ============================================================
    # SensorTf — velodyne → base_link 오프셋
    # ============================================================
    sensor_tf:
      tf_x: 0.0
      tf_y: 0.0
      tf_z: 0.7

    # ============================================================
    # Timeouts
    # ============================================================
    timeouts:
      perception_ms: 300

    # ============================================================
    # Chainer — LineChainer 파라미터 (신규)
    #
    # DFS 기반 nearest-neighbor 체이닝에서 사용하는 탐색 파라미터.
    # 후보가 없으면 search_radius를 step씩 증가시키며 max까지 확장.
    # ============================================================
    chainer:
      search_radius: 2.0       # [m] 초기 탐색 반경
      search_radius_step: 0.4  # [m] 반경 증가 스텝
      search_radius_max: 2.2  # [m] 최대 탐색 반경
      forward_angle: 1.57   # [rad] 전방 각도 (π/2 = 90°, ±45° cone)
      min_regress_pts: 2       # PCA regression 최소 점 수
      max_regress_pts: 4       # PCA regression 최대 점 수
      resample_ds: 0.1         # [m] 체인 리샘플 간격
