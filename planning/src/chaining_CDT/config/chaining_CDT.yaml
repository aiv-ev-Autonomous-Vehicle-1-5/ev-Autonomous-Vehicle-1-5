# ============================================================================
# planning_lc.yaml — LC Planner 파라미터 설정 파일
#
# planning_mr_ver 기반 + chainer 섹션 추가
# ============================================================================
lc_planner_node:
  ros__parameters:

    # ============================================================
    # CDT Planner — CDT 기반 Centerline 추출
    # ============================================================
    cdt_planner:
      iso_ratio_max: 1.4         # isosceles-like 조건: sides[1]/sides[2] < 이 값
      pointed_ratio_min: 2.0     # pointedness 조건: sides[2]/sides[0] > 이 값
      area_min: 0.3              # 면적 조건 [m²]
      max_circumcenter_dist: 2.0 # 외심 간 최대 연결 거리 [m]
      forward_dot_min: -0.3      # 전방 검사: dot(heading, to_next) > 이 값

    # ============================================================
    # Vehicle (T870)
    # ============================================================
    vehicle:
      width: 1.50
      wheelbase: 0.87
      delta_max: 0.314

    # ============================================================
    # Safety
    # ============================================================
    safety:
      margin: 0.10

    # ============================================================
    # Speed
    # ============================================================
    speed:
      v_max: 1.60
      a_lat_max: 2.0

    # ============================================================
    # Postprocess
    # ============================================================
    postprocess:
      resample_ds: 0.10
      smooth_window: 5
      prune_max_dev: 0.15

    # ============================================================
    # SensorTf — velodyne → base_link 오프셋
    # ============================================================
    sensor_tf:
      tf_x: 0.0
      tf_y: 0.0
      tf_z: 0.7

    # ============================================================
    # Timeouts
    # ============================================================
    timeouts:
      perception_ms: 300

    # ============================================================
    # Chainer — DirectionChainer v2 파라미터
    #
    # Component → Backbone → Branch 기반 좌/우 차선 경계 체이닝.
    # ============================================================
    chainer:
      # --- Seed 선택 ---
      side_seed_y: 0.3        # [m] |y| < 이 값이면 seed 후보 제외

      # --- kNN + 게이트 ---
      k: 8                    # centroid kNN 후보 수
      d_max: 1.5              # [m] neighbor 최대 거리
      forward_cone_deg: 120.0 # [deg] 전방 cone 전체 각도 (±60°)
      lateral_gate: 0.75      # [m] 횡방향 오차 한계

      # --- 비용함수 가중치 ---
      alpha: 1.0              # 거리 비용
      beta: 1.2               # 방향 오차 비용
      gamma: 0.6              # 횡오차 비용
      delta: 0.2              # 크기 변화 비용 (콘 전용)

      # --- Backbone (greedy chaining) ---
      lambda_side: 0.5        # side preference 가중치

      # --- Branch ---
      branch_mode: "backbone_and_branches"
      max_branch_len: 40      # branch 최대 길이

      # --- 종료/제한 ---
      max_chain_len: 100      # backbone 최대 길이

      # --- 콘 우선순위 ---
      cone_priority: true

      # --- 신뢰도 필터 ---
      min_confidence: 0.1

      # --- 리샘플링 ---
      resample_ds: 0.1        # [m] component 전체 리샘플 간격

      # --- 디버그 ---
      publish_debug: true
      debug_chainer_stats: true   # 리샘플 전 좌/우 콘/차선 개수 로그 출력
