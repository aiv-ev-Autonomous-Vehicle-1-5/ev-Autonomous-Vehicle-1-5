# =============================================================
# track_planning 파라미터 설정 (v3 spec)
# =============================================================
# 로컬 플래너 파이프라인의 모든 파라미터를 정의하는 YAML 파일
# launch 파일에서 이 파일을 로드하여 노드에 파라미터를 전달함
#
# 파이프라인 흐름:
#   입력 파싱 → 복도 구축 → 페어 검증 → 가상 경계 → 센터라인 →
#   코스트맵 → 모드 선택(DIRECT/ASTAR) → 경로 생성 → 후처리 → 안전 검사
#
# 노드 이름 (launch 파일에서 지정): local_planner_node
# =============================================================
local_planner_node:
  ros__parameters:

    # ============================================================
    # ROI (Region of Interest) & 그리드 설정
    # ============================================================
    # 코스트맵 생성 영역을 정의 (차량 기준 좌표계, ego-centric)
    # x: 전방(+) / 후방(-), y: 좌(+) / 우(-)
    roi:
      x_min: -1.0          # [m] 후방 ROI 한계 (차량 뒤쪽 1m까지 포함)
      x_max: 10.0           # [m] 전방 ROI 한계 (차량 앞쪽 10m까지)
      y_min: -4.0           # [m] 우측 ROI 한계
      y_max:  4.0           # [m] 좌측 ROI 한계
      resolution: 0.10      # [m/cell] 코스트맵 셀 해상도 (10cm × 10cm 격자)

    # ============================================================
    # 차량 스펙 (T870 전동 카트)
    # ============================================================
    vehicle:
      width: 0.50           # [m] 차량 폭 (포인트 모델에서 inflation 반경에 흡수)
      wheelbase: 0.87       # [m] 축간 거리 (앞바퀴-뒷바퀴 간격)
      delta_max: 0.314      # [rad] 최대 조향각 (~18도, Ackermann 모델 기준)

    # ============================================================
    # 안전 마진 (차량 포인트 모델)
    # ============================================================
    # 실제 inflation 반경 = vehicle.width/2 + margin + extra_margin
    # 차량을 점(point)으로 취급하고, 그만큼 장애물/경계를 팽창시키는 방식
    safety:
      margin: 0.10          # [m] 기본 안전 마진
      margin_boundary: 0.0  # [m] 경계선 추가 마진 (0이면 기본 마진만 적용)
      margin_obstacle: 0.0  # [m] 장애물 추가 마진 (0이면 기본 마진만 적용)

    # ============================================================
    # 복도(Corridor) 구축 파라미터
    # ============================================================
    # Greedy Chaining 알고리즘으로 차선 경계점들을 순서대로 연결
    corridor:

      # --- 시드(Seed) 포인트 선택 ---
      # 복도 구축의 시작점을 결정하는 파라미터
      seed:
        x_seed_min: 0.5     # [m] 시드 최소 전방 거리 (차량 바로 앞은 제외)

      # --- 후보 필터링 ---
      # 다음 포인트 후보를 검색할 범위를 제한
      filter:
        s_min: 0.05          # [m] 최소 전진 거리 (이전 점보다 최소한 이만큼 앞에 있어야 함)
        s_max: 2.0           # [m] 최대 전방 탐색 거리 (너무 먼 점은 제외)
        d_max: 2.0           # [m] 최대 횡방향 거리 (센터라인에서 너무 벗어나면 제외)
        r_search: 2.5        # [m] 원형 탐색 반경 (현재 점 기준)

      # --- 스코어링 (점수 계산) ---
      # 후보 포인트의 적합도를 가중합으로 평가
      # score = w_s·(전진 점수) - w_d·(횡편차) - w_a·(각도 편차) - w_p·(예측 오차)
      score:
        w_s: 1.0             # 가중치: 전진 방향 진행도 (높을수록 앞으로 가는 점 선호)
        w_d: 0.8             # 가중치: 횡방향 편차 페널티 (높을수록 직진 선호)
        w_a: 0.5             # 가중치: 각도 편차 페널티 (높을수록 매끄러운 경로 선호)
        w_p: 0.3             # 가중치: 예측 오차 페널티 (이전 추세와 다른 점 감점)
        theta_max: 1.047     # [rad] 최대 허용 각도 (~60도, 이 이상 꺾이면 후보 제외)
        step_pred: 0.5       # [m] 예측 스텝 (이전 점의 접선 방향으로 이만큼 앞의 예측 위치와 비교)

      # --- Top-K 선택 ---
      # 상위 K개 후보만 유지하여 탐색 범위 제한 (성능 최적화)
      topk:
        enable: false        # Top-K 활성화 여부 (false: 모든 후보 평가)
        k_top: 5             # 유지할 상위 후보 수

      # --- 기준 접선 (Reference Tangent) ---
      # 복도 구축 시 진행 방향을 추정하기 위한 회귀(regression) 윈도우
      ref_tangent:
        n_reg: 7             # 접선 회귀에 사용할 최근 포인트 수

      # --- 콜드 스타트 (Cold Start) ---
      # 복도가 처음 생성될 때 (이전 프레임 센터라인 없음) 적용되는 조건
      cold_start:
        min_centerline_points: 3       # 센터라인 최소 포인트 수 (이하이면 콜드 스타트)
        theta_heading_gate_deg: 60.0   # [도] 콜드 스타트 시 허용 진행 방향 범위

      # --- 일반 설정 ---
      general:
        max_points_side: 100 # 한쪽 경계의 최대 포인트 수 (무한 루프 방지)

    # ============================================================
    # 페어 검증 (Pair Validator) 파라미터
    # ============================================================
    # 좌/우 복도 경계가 유효한 차선 쌍인지 검증
    # 폭(width), 각도(angle), 교차(crossing) 3가지 기준으로 판단
    pair:
      resample_ds: 0.2      # [m] 검증 전 경계 리샘플 간격 (등간격으로 재배치)
      theta_mean_th: 0.35   # [rad] 평균 각도차 임계값 (~20도, 이상이면 쌍 무효)
      theta_max_th: 0.70    # [rad] 최대 각도차 임계값 (~40도, 한 지점이라도 이상이면 무효)
      w_min: 0.8            # [m] 최소 허용 차로 폭 (이하이면 쌍 무효)
      w_max: 3.0            # [m] 최대 허용 차로 폭 (이상이면 쌍 무효)
      w_std_th: 0.5         # [m] 폭 표준편차 임계값 (폭이 불안정하면 무효)

    # ============================================================
    # 가상 경계 (Virtual Boundary) 파라미터
    # ============================================================
    # 한쪽 경계만 감지된 경우, 반대편을 EMA(지수 이동 평균)
    # 기반 추정 폭으로 생성
    virtual:
      default_track_width: 1.5   # [m] 기본 트랙 폭 (대회 규격: 1.5m 차로 폭)
      ema_alpha: 0.3             # EMA 가중치 (0~1, 높을수록 최근 값에 민감)
      min_corridor_width: 0.6    # [m] 최소 복도 폭 (이하로 줄어들지 않도록 제한)

    # ============================================================
    # 팽창(Inflation) 파라미터
    # ============================================================
    # 코스트맵에서 장애물/경계를 팽창시키는 추가 마진
    # 실제 팽창 반경 = vehicle.width/2 + safety.margin + extra_margin
    inflation:
      boundary_extra_margin: 0.0  # [m] 경계선 팽창 추가 마진
      obstacle_extra_margin: 0.0  # [m] 장애물 팽창 추가 마진

    # ============================================================
    # 코스트맵 검증 (DIRECT 모드 충돌 검사)
    # ============================================================
    # DIRECT 모드(센터라인 직접 추종) 시 경로가 장애물과 충돌하는지 검사
    # 충돌 감지 시 → ASTAR 모드로 전환
    costmap_valid:
      ds_check: 0.1         # [m] 센터라인 샘플링 간격 (촘촘할수록 정밀, 느림)
      cost_th: 80            # 코스트 임계값 (이 이상이면 충돌로 판단, 0~255)

    # ============================================================
    # 목표점 선택 (Goal Selection) 파라미터
    # ============================================================
    # A* 경로 탐색의 목표점을 센터라인 위에서 선택
    # Lookahead 거리 = L0 + kv × 현재속도
    goal:
      lookahead_l0: 3.0     # [m] 기본 Lookahead 거리
      lookahead_kv: 0.5     # [s] 속도 비례 계수 (빠를수록 더 멀리 봄)
      ring_samples: 36      # Ring 방식 보조 탐색 시 샘플 수 (360도/36 = 10도 간격)

    # ============================================================
    # 속도 제한 파라미터
    # ============================================================
    # 안전 검사에서 곡률 기반 속도 제한에 사용
    # v_safe = sqrt(a_lat_max / curvature)
    speed:
      v_max: 1.60            # [m/s] T870 최대 속도
      a_lat_max: 2.0         # [m/s²] 최대 횡가속도 (이 이상이면 미끄러짐 위험)

    # ============================================================
    # 후처리 (Postprocess) 파라미터
    # ============================================================
    # A* 경로의 계단 현상(staircase)을 제거하고 부드러운 경로로 변환
    # 순서: Greedy Shortcut 가지치기 → 이동 평균 스무딩 → 등간격 리샘플
    postprocess:
      resample_ds: 0.10      # [m] 최종 경로 포인트 간격
      smooth_window: 5        # 이동 평균 윈도우 크기 (홀수 권장)
      prune_max_dev: 0.15    # [m] 가지치기 시 최대 허용 횡편차 (직선 단축 허용 범위)

    # ============================================================
    # 모드 선택기 (Mode Selector) 파라미터
    # ============================================================
    # DIRECT(센터라인 직접 추종) vs ASTAR(장애물 회피) 모드 결정
    # 5가지 ASTAR 전환 조건:
    #   1) 센터라인 포인트 부족 (3개 미만)
    #   2) 센터라인 jump 감지 (연속 점 간 거리 > centerline_jump_th)
    #   3) 코스트맵 충돌 감지
    #   4) 센터라인이 ROI 밖
    #   5) enable_astar 강제 활성화
    mode_selector:
      l_check: 5.0          # [m] 전방 검사 거리 (이 범위 내에서 충돌 체크)
      centerline_jump_th: 1.0  # [m] 센터라인 점프 임계값 (이상이면 불연속으로 판단)
      enable_astar: true     # true: A* 모드 활성화, false: 항상 DIRECT 모드

    # ============================================================
    # 타임아웃 설정
    # ============================================================
    # 각 입력 데이터의 최대 허용 지연 시간
    # 타임아웃 초과 시 → stale(오래된 데이터)로 판단하여 안전 정지
    timeouts:
      odom_ms: 100           # [ms] Odometry 타임아웃 (100ms = 10Hz 이상 필요)
      perception_ms: 300     # [ms] 인지(Perception) 타임아웃 (300ms = ~3Hz 이상 필요)
      plan_ms: 100           # [ms] 계획(Planning) 타임아웃 (이전 경로 유효 기간)
